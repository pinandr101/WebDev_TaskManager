<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ToDoList</title>
  <link rel="stylesheet" href="./src/style.css">
  <link rel="icon" href="./public/icon.png" sizes="100x100">
</head>
<body>
  <main>

    <div id ="toDoList" class="width60">
1
    </div>

    <div id="doneList" class="width60">
1
    </div>

    <div id="addTaskSection" class="width60">
      <button id="addTaskButton">Add Task</button>
    </div>
  </main>
  
  <dialog id="addTaskDialog">
  <form method="dialog">
    <h2>Add New Task</h2>
    
    <div class="form-group">
      <label for="taskTitle">Task Title *</label>
      <input type="text" id="taskTitle" required placeholder="What needs to be done?">
    </div>
    
    <div class="form-group">
      <label for="taskDescription">Description</label>
      <textarea id="taskDescription" rows="3" placeholder="Details"></textarea>
    </div>
    
    <div class="form-group">
      <label for="taskDueDate">Due Date</label>
      <input type="date" id="taskDueDate">
    </div>
    
    <div class="dialog-buttons">
      <button type="button" id="cancelButton">Cancel</button>
      <button type="submit" id="saveButton">Save Task</button>
    </div>
  </form>
</dialog>

  <script src="./src/ToDoListManager.js"></script>
</body>
</html>
